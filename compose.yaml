services:
  db_service:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: time-user
      POSTGRES_PASSWORD: time-pw
      POSTGRES_DB: timescaledb
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time-user -d timescaledb"]
      interval: 5s
      timeout: 5s
      retries: 5

  edutrack-backend:
    build:
      context: ./eduTrack-backend
      dockerfile: Dockerfile
    env_file:
      - ./eduTrack-backend/.env.compose
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8002:8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    depends_on:
      db_service:
        condition: service_healthy
    volumes:
      - ./eduTrack-backend/src:/code:rw

  edutrack-frontend:
    build:
      context: ./eduTrack-frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8002
    ports:
      - "3000:3000"
    depends_on:
      - edutrack-backend
    volumes:
      - ./eduTrack-frontend/src:/app/src:rw
      - ./eduTrack-frontend/index.html:/app/index.html:rw
      - ./eduTrack-frontend/vite.config.ts:/app/vite.config.ts:rw

volumes:
  timescaledb_data:
